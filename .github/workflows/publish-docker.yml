# ============================================================
# 自动发布 Docker 镜像到 GHCR
#
# 触发方式：
#   1. 推送 vX.Y.Z 格式的 tag（推荐发版方式）
#   2. Actions 页面手动触发（workflow_dispatch，输入版本号）
#   3. 推送到 main 分支（仅构建验证，不推送镜像）
#
# 发布后镜像 tag：<版本号> 与 latest（手动触发可选是否打 latest）
# 使用者升级：修改 .env 的 DOCUSAURUS_VERSION → docker compose pull → up -d
# ============================================================

name: publish-docker

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v 前缀，如 3.10.3）'
        required: true
      push_latest:
        description: '是否同时推送 latest tag'
        type: boolean
        default: true

env:
  # 镜像仓库：ghcr.io/<仓库 owner>/<镜像名>
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/docusaurus-site
  # GitHub Actions 网络环境良好，基础镜像直接用 docker.io
  BASE_REGISTRY: docker.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解析版本号
        id: version
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # tag 形如 v3.10.3 → 去掉 v 前缀
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号格式应为 X.Y.Z，实际为: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # 与 build.sh 保持一致：同步 Docusaurus 版本到 site/package.json
      - name: 同步 Docusaurus 版本到 site/package.json
        if: steps.version.outputs.version != ''
        shell: bash
        run: |
          sed -i -E "s/\"@docusaurus\/([A-Za-z0-9_-]+)\": \"[^\"]+\"/\"@docusaurus\/\1\": \"${{ steps.version.outputs.version }}\"/g" site/package.json
          git --no-pager diff site/package.json || true

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录镜像仓库
        if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像 tag
        id: meta
        if: steps.version.outputs.version != ''
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name != 'workflow_dispatch' || github.event.inputs.push_latest == 'true' }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          # main 分支推送仅做构建验证，不推送
          push: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_REGISTRY=${{ env.BASE_REGISTRY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
