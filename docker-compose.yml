# ============================================================
# Docusaurus 文档站点 —— 一键编排
#
#   docker compose up -d --build docusaurus   启动生产服务（8080）
#   docker compose up -d dev                  启动开发预览（3000，可选）
#
# 内容发布：编辑 site/ 下的 md 后
#   docker compose restart docusaurus         容器启动时自动编译新内容
# 站点配置：修改下方的 x-site-config 后
#   docker compose up -d docusaurus           重新创建容器，启动时编译生效
# 版本升级：修改 .env 中 DOCUSAURUS_VERSION 后
#   docker compose pull docusaurus && docker compose up -d docusaurus
#
# 低内存服务器（≤ 2GB）防编译 OOM：
#   1) 编译已启用 Docusaurus Faster（Rspack，峰值约 1GB），
#      前提是镜像与挂载的 site/ 均为新版（含 future.faster 配置）
#   2) 建议加 swap（一次性操作）：
#      sudo fallocate -l 2G /swapfile && sudo chmod 600 /swapfile \
#        && sudo mkswap /swapfile && sudo swapon /swapfile \
#        && echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
#   3) 仍紧张时，取消下方 NODE_OPTIONS 注释限制 Node 堆（代价：编译变慢）
# ============================================================

# -------- 站点元数据（SEO / 标题 / 图标 / 部署路径） --------
# 全部可选：不设置时使用 site/docusaurus.config.js 中的默认值
# 修改后执行 docker compose up -d docusaurus 重建容器即可生效
x-site-config: &site-config
  SITE_TITLE: My Site                                  # 站点标题（<title>、og:title）
  SITE_TAGLINE: Docusaurus 生产环境 Docker 镜像          # 副标题（首页、全局 description）
  SITE_URL: https://example.com                        # 部署域名（canonical / sitemap）
  SITE_BASE_URL: /                                     # 部署子路径（如 /docs/）
  SITE_FAVICON: /img/favicon.ico                       # 标签图标（放 site/static/img/ 下）
  # SITE_LOGO: /img/logo.png                           # 导航栏 Logo（放 site/static/img/ 下，留空/不设置则不显示）
  SITE_LOCALE: zh-Hans                                 # 站点语言
  SITE_KEYWORDS: Docusaurus,文档                       # SEO 关键词
  # SITE_NAVBAR_TITLE: 导航栏标题（默认同 SITE_TITLE）
  SITE_FOOTER_COPYRIGHT: 'Copyright © 2026 My Site. | <a href="https://beian.miit.gov.cn/" target="_blank" rel="noreferrer">京ICP备XXXXXXXX号</a>'  # 页脚版权文案（支持 HTML）

  # -------- 文档版本管理（全部可选，详见 README「文档版本」） --------
  # 发布新文档版本（与产品版本对应）：复制 site/RELEASE.txt.example 为
  # site/RELEASE.txt、填产品版本号，然后 docker compose restart docusaurus 即可，
  # 全程无需命令行参数与本地 Node/npm
  # 默认「当前文档即最新版」：site/docs/ 始终发布在 /docs，历史版本在 /docs/<版本号>
  # SITE_DOCS_LAST_VERSION: current          # 最新版指向；设为版本名（如 2.0）则 site/docs/ 变为 /docs/next 的「下一版开发中」
  # SITE_DOCS_INCLUDE_CURRENT: 'true'        # 当前文档尚未定稿时设为 false，暂不对外发布
  # SITE_DOCS_CURRENT_LABEL: Current         # 当前版本在下拉菜单中的标签
  # SITE_DOCS_CURRENT_PATH: ''               # 当前版本 URL 路径（留空自动：最新版=/docs，否则 /docs/next）
  # SITE_DOCS_VERSION_DROPDOWN: ''           # 导航栏版本下拉菜单（留空=发布过版本后自动显示；true/false 强制开/关）

services:
  # -------- 生产服务：启动时编译挂载的站点源码，Nginx 对外服务 --------
  docusaurus:
    image: ${IMAGE_NAME:-docusaurus-site}:${DOCUSAURUS_VERSION:-3.10.2}
    container_name: docusaurus
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      <<: *site-config
      # 低内存服务器防编译 OOM：限制 Node 堆上限（仅影响 node 进程，不影响 nginx）
      # 1GB 内存服务器建议 512，2GB 建议 1024；代价是 GC 更频繁、编译变慢
      # NODE_OPTIONS: --max-old-space-size=512
    volumes:
      # 挂载站点源码：目录为空时容器会自动复制镜像内置的样例站点（含配置）过来，
      # 便于参考修改；修改 md 后 restart 即生效
      - ./site:/site-src
      # 编译缓存：加速二次编译（约 30s -> 7s）
      - docusaurus_cache:/app/site/.docusaurus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 180s
    build:
      context: .
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-docker.m.daocloud.io}

  # -------- 开发模式：Docusaurus dev server，实时热更新（可选） --------
  dev:
    image: ${BASE_REGISTRY:-docker.m.daocloud.io}/library/node:22-alpine
    container_name: docusaurus-dev
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      <<: *site-config
      NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
    volumes:
      - ./site:/app
      # node_modules 用卷隔离，避免 Linux 二进制污染宿主机目录
      - dev_node_modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run start -- --host 0.0.0.0"

volumes:
  dev_node_modules:
  docusaurus_cache:
